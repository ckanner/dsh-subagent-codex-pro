name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tests run the TypeScript sources directly, so the lane needs a Node
        # with native type stripping and no build step.
        node: ['22.x', '24.x']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build public API and guardian
        run: npm run build
      - name: Install and exercise the packed public machine entry
        run: npm run test:package
